 <linearGradient id="collar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#74512b"/><stop offset=".22" stop-color="#ddba80"/><stop offset=".43" stop-color="#fff0c8"/><stop offset=".65" stop-color="#b68d52"/><stop offset="1" stop-color="#624224"/></linearGradient>
 <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#281b17"/><stop offset=".2" stop-color="#694333"/><stop offset=".4" stop-color="#956747"/><stop offset=".57" stop-color="#775039"/><stop offset=".85" stop-color="#442b23"/><stop offset="1" stop-color="#241916"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#113b4c"/><stop offset=".55" stop-color="#3e8791"/><stop offset="1" stop-color="#a2c9c0"/></linearGradient>
 <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#407b80"/><stop offset="1" stop-color="#164a5d"/></linearGradient>
 <linearGradient id="glassLight" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#e3ffff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="glassShade" cx=".5" cy=".5" r=".5"><stop offset=".74" stop-color="#051e2e" stop-opacity="0"/><stop offset="1" stop-color="#041823" stop-opacity=".65"/></radialGradient>
 <filter id="ground" x="-.5" y="-2" width="2" height="5"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="lift" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="contact" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="1.5"/></filter>
