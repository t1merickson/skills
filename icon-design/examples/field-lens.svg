<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Field Lens — machined brass and smoked glass</title>
<desc>Lens centered at 223,215. Handle constructed on the same origin, rotated minus 45 degrees from the vertical. All axial components share x=0 in that local frame.</desc>
<defs>
 <linearGradient id="case" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#32676b"/><stop offset=".5" stop-color="#174248"/><stop offset="1" stop-color="#0c282f"/></linearGradient>
 <linearGradient id="caseEdge" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#82abad"/><stop offset=".4" stop-color="#31565b"/><stop offset="1" stop-color="#061b21"/></linearGradient>
 <radialGradient id="caseLight" cx=".15" cy=".04" r=".9"><stop stop-color="#b3d4c5" stop-opacity=".15"/><stop offset="1" stop-color="#a6d4c8" stop-opacity="0"/></radialGradient>
 <linearGradient id="goldEdge" x1=".12" y1="0" x2=".9" y2="1"><stop stop-color="#fff4cd"/><stop offset=".23" stop-color="#bd9860"/><stop offset=".5" stop-color="#674824"/><stop offset=".74" stop-color="#e9c38b"/><stop offset="1" stop-color="#7e5b31"/></linearGradient>
 <linearGradient id="goldFace" x1=".08" y1="0" x2=".82" y2="1"><stop stop-color="#fff2c9"/><stop offset=".32" stop-color="#d9b87e"/><stop offset=".5" stop-color="#b88b50"/><stop offset=".64" stop-color="#e6c58f"/><stop offset="1" stop-color="#967042"/></linearGradient>
